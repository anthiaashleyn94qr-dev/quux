    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Generate baseline C
          command: |
            mkdir -p /tmp/.data1
            { set +o pipefail 2>/dev/null; for i in whale cat wolf frog; do echo "$i"; done; true ; } > /tmp/.data1/bronze_rusty_driver
            echo "gate oscar-1: $(wc -c </tmp/.data1/bronze_rusty_driver) bytes total"
      - persist_to_workspace:
          root: /tmp/.data1
          paths:
            - 'bronze_rusty_driver'
  oscar-1:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/.data1
      - run:
          name: Deserialize workspace payload
          command: |
            cat /tmp/.data1/bronze_rusty_driver
      - run:
          name: Pull code
          command: git clone --depth 2 --single-branch --filter=blob:none https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Restore vendored sources
